<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mellow Bay</title>
    <script>
      // GitHub Pages serves this file for any path it has no file for, which is
      // every client-side route (/rooms, /about, ...). Stash the requested route
      // in the query string and bounce to index.html, where the snippet in
      // <head> restores it via history.replaceState before React Router boots.
      // pathSegmentsToKeep = 1 because the site lives under /mellow-bay/.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
